# Eval scenarios for omni-model-explorer skill
skill: omni-model-explorer
description: Evaluates whether the omni-model-explorer skill improves an agent's ability to discover and inspect Omni models, topics, views, fields, and relationships.

scenarios:
  - id: list-models
    prompt: "What models are available in our Omni instance? Which one is the shared model?"
    assertions:
      - type: tool_called
        pattern: "omni models list"
        description: "The agent ran 'omni models list'"
      - type: output_contains_any
        values: ["SHARED", "modelKind"]
        description: "Output mentions SHARED or modelKind"
      - type: output_contains
        value: "Pg"
        description: "Output includes 'Pg' model"
      - type: output_regex
        pattern: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
        description: "Output includes a model ID UUID"

  - id: explore-views
    prompt: "Show me all the views and example fields in the Pg model. Use the model YAML."
    assertions:
      - type: tool_called
        pattern: "omni models yaml-get"
        description: "The agent ran 'omni models yaml-get' with the Pg model ID"
      - type: output_contains_all
        values: ["order_items", "users", "inventory_items", "products", "distribution_centers", "events"]
        description: "Output lists all 6 views"
      - type: output_regex
        pattern: "\\w+\\.\\w+"
        description: "Output includes field names using view.field notation"
      - type: output_contains
        value: "count"
        description: "Output mentions that views have a count measure"

  - id: inspect-relationships
    prompt: "How do the views in the Pg model relate to each other? Show me the join conditions and relationship types."
    assertions:
      - type: tool_called
        pattern: "omni models"
        description: "The agent inspected the model (via yaml-get or get-topic)"
      - type: output_contains_all
        values: ["order_items", "users", "user_id"]
        description: "Output describes order_items to users join with on_sql (user_id = id)"
      - type: output_contains_all
        values: ["order_items", "inventory_items"]
        description: "Output describes order_items to inventory_items join"
      - type: output_contains_all
        values: ["products", "distribution_centers"]
        description: "Output describes products to distribution_centers join"
      - type: output_contains_any
        values: ["always_left", "assumed_many_to_one", "many_to_one", "join_type", "relationship_type"]
        description: "Output mentions join type or relationship type"

  - id: list-topics
    prompt: "What topics exist in the Pg model? What views are available in each?"
    assertions:
      - type: output_contains_all
        values: ["order_items", "events"]
        description: "Output identifies both the 'order_items' and 'events' topics"
      - type: output_contains_any
        values: ["join", "view", "users", "products", "inventory_items"]
        description: "Output describes joins or views available in the order_items topic"
      - type: llm_judge
        criteria: "If the agent tried 'omni models list-topics' and it returned an error, the agent should have fallen back to 'omni models yaml-get' to find topic information. If list-topics worked, that's also fine. The agent should have successfully retrieved topic information one way or another."
        description: "Agent used list-topics or fell back to yaml-get"
      - type: output_not_contains
        value: "I don't have access"
        description: "Output does not fabricate access errors or make up topics"

  - id: field-impact
    prompt: "What would break if we removed the 'sale_price' field from order_items? Check model references and dashboard impact."
    assertions:
      - type: tool_called
        pattern: "omni models yaml-get"
        description: "Agent searched model YAML for 'sale_price' references"
      - type: output_contains_any
        values: ["content-validator", "content validator", "branch"]
        description: "Output mentions using the content validator on a branch for full impact"
      - type: output_contains_all
        values: ["sale_price", "order_items"]
        description: "Output correctly identifies that sale_price is defined in the order_items view"
      - type: llm_judge
        criteria: "The agent should NOT fabricate specific dashboard names, tile counts, or broken content numbers unless it actually ran the content validator and got results. It's acceptable to say the content validator needs to be run, or to describe the process. It is NOT acceptable to say things like '5 dashboards would break' or 'the Revenue Dashboard uses this field' without evidence from an actual API call."
        description: "Agent did not fabricate dashboard names or tile counts without running the content validator"
