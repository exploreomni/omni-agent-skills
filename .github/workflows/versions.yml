name: Versions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A PR may leave the manifests untouched — the stamp job below fills them in
  # after merge. What it may not do is hand-write a version that disagrees with
  # versions.json, which is how the ten fields drifted apart before.
  guard:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Test version PR automation
        run: python3 .github/scripts/test_version_pr.py
      - name: Reject hand-edited versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            git fetch origin main
            BASE_SHA=origin/main
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD -- \
            '.claude-plugin/*.json' '.cursor-plugin/*.json' \
            'skills/omni-integrations/.claude-plugin/*.json' \
            'skills/omni-integrations/.cursor-plugin/*.json')
          if [ -z "$CHANGED" ]; then
            echo "No manifest changes — versions.json alone is the way to bump."
            exit 0
          fi
          echo "Manifests touched by this PR:"
          echo "$CHANGED" | sed 's/^/  /'
          echo
          # Touching them is allowed, but only in agreement with versions.json.
          python3 .github/scripts/stamp_versions.py --check

  stamp:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: version-stamp-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Open or update version stamp PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/open_version_pr.sh
